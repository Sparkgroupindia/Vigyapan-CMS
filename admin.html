<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vigyapan CMS Admin</title><style>
:root{--navy:#062944;--navy2:#031a2c;--gold:#e5b85f;--bg:#f4f6f8;--line:#dfe5ea;--muted:#657486;--danger:#b12b2b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:#152536}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:var(--navy2);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.08em}.brand small{display:block;color:#b9c7d1;font-size:9px;letter-spacing:.12em}.wrap{max-width:1250px;margin:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px #001b2b18;border:1px solid var(--line)}h1,h2,h3{margin-top:0}h1{font-family:Georgia,serif;font-size:38px}.ey{font-size:10px;font-weight:800;letter-spacing:.15em;color:#a57520}.field{margin:12px 0}.field label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#182536}.dark{background:var(--navy);color:#fff}.light{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0caca}.msg{font-size:11px;color:var(--danger);min-height:18px}.dash{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-size:11px;font-weight:800}.tab.active{background:var(--navy);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#f8fafb;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:25px}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:15px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:14px;align-items:center;justify-content:space-between}.item .main{flex:1}.item strong{display:block}.item small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:10px}.modal{position:fixed;inset:0;background:#031a2ccc;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:7px;font-size:11px}.thumb{width:90px;height:70px;object-fit:cover;border-radius:10px;background:#eee}.video-thumb{width:90px;height:70px;object-fit:cover;border-radius:10px;background:#111}.drop{border:1px dashed #c8d0d8;padding:14px;border-radius:12px;background:#fafbfc}.notice{padding:10px 12px;border-radius:10px;background:#fff7df;color:#7b5a1b;font-size:11px;margin-bottom:12px}.mini-btn{padding:7px 9px;font-size:10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.links a{font-size:11px;color:#fff;margin-left:10px}.hint{font-size:10px;color:var(--muted)}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.links a{display:none}}@media(max-width:500px){.cards{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:12px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="ey">VIGYAPAN • SECURE CMS</div><h1>Admin Dashboard</h1><p style="color:var(--muted);font-size:13px">Website, services, packages, images, videos, contact and links — all editable here.</p><div class="field"><label>ADMIN KEY</label><input id="key" type="password" autocomplete="current-password" placeholder="Enter admin key"></div><button class="btn gold" style="width:100%" id="loginBtn">Open Dashboard →</button><div id="loginMsg" class="msg"></div></div></div>
<div id="dash" class="dash"><div class="top"><div class="brand">VIGYAPAN <small>WEBSITE CMS</small></div><div class="links"><a id="siteLink" target="_blank">Website</a><a id="sheetLink" target="_blank">Sheet</a><a id="folderLink" target="_blank">Drive</a><button id="logout" class="btn light" style="padding:7px 10px;font-size:10px">Logout</button></div></div><div class="wrap"><div class="nav"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="settings">Website Settings</button><button class="tab" data-tab="services">Services</button><button class="tab" data-tab="plans">Packages</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="testimonials">Testimonials</button><button class="tab" data-tab="leads">Leads</button><button class="tab" data-tab="security">Admin Key</button></div><div id="content"></div></div></div>
<div id="modal" class="modal"><div class="modalbox"><div class="toolbar"><h2 id="modalTitle">Edit</h2><button class="btn light" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<script src="config.js"></script><script>
let KEY=sessionStorage.getItem('VIGYAPAN_ADMIN_KEY')||'';let STATE=null;let currentTab='overview';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function api(action,fields={}){return new Promise((resolve,reject)=>{const cb='__v_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const q=new URLSearchParams({action,callback:cb,...fields});window[cb]=d=>{delete window[cb];s.remove();d&&d.ok?resolve(d):reject(new Error(d&&d.error||'Request failed'))};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('Apps Script API did not respond.'))};s.src=API_URL+'?'+q.toString();document.body.appendChild(s)})}
function adminApi(action,fields={}){return api(action,{key:KEY,...fields})}
async function login(){const k=$('key').value.trim();if(!k){$('loginMsg').textContent='Admin key enter karo.';return}KEY=k;sessionStorage.setItem('VIGYAPAN_ADMIN_KEY',KEY);$('loginBtn').disabled=true;$('loginMsg').textContent='Connecting…';try{const r=await adminApi('login');showDash(r)}catch(e){sessionStorage.removeItem('VIGYAPAN_ADMIN_KEY');KEY='';$('loginMsg').textContent=e.message}finally{$('loginBtn').disabled=false}}
function showDash(data){STATE=data;$('login').style.display='none';$('dash').style.display='block';$('siteLink').href=location.origin+location.pathname.replace('/admin.html','')+'/';$('sheetLink').href=data.spreadsheetUrl;$('folderLink').href=data.folderUrl;renderTab(currentTab)}
function renderTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const d=STATE.data;if(tab==='overview')$('content').innerHTML=`<div class="cards"><div class="stat"><span>Services</span><b>${d.services.length}</b></div><div class="stat"><span>Packages</span><b>${d.plans.length}</b></div><div class="stat"><span>Media</span><b>${d.gallery.length}</b></div><div class="stat"><span>Testimonials</span><b>${d.testimonials.length}</b></div><div class="stat"><span>Leads</span><b>${(d.leads||[]).length}</b></div></div><div class="panel"><div class="notice">All website content is managed from this dashboard. Images are compressed toward 100 KB before upload; videos are uploaded as video files.</div><h3>Quick actions</h3><div class="actions"><button class="btn gold" onclick="renderTab('settings')">Edit Website</button><button class="btn dark" onclick="renderTab('gallery');setTimeout(()=>openEditor('gallery'),100)">Upload Image / Video</button><button class="btn light" onclick="renderTab('plans');setTimeout(()=>openEditor('plans'),100)">Add Plan</button><button class="btn light" onclick="renderTab('services');setTimeout(()=>openEditor('services'),100)">Add Service</button></div></div>`;else if(tab==='settings')renderSettings();else if(['services','plans','gallery','testimonials'].includes(tab))renderCollection(tab);else if(tab==='leads')renderLeads();else renderSecurity()}
const settingKeys=['siteName','siteTagline','logoUrl','heroEyebrow','heroTitle','heroText','heroButton','heroButtonLink','headerCta','headerCtaLink','aboutEyebrow','aboutTitle','aboutText','aboutButton','aboutButtonLink','servicesEyebrow','servicesTitle','servicesText','plansEyebrow','plansTitle','plansText','galleryEyebrow','galleryTitle','galleryText','contactEyebrow','contactTitle','contactText','phone','whatsapp','email','address','instagram','facebook','youtube','linkedin','mapEmbedUrl','mapLink','navHome','navAbout','navServices','navPlans','navGallery','navContact','footerText','heroAutoMs','galleryAutoMs','whyTitle','why1Title','why1Text','why2Title','why2Text','why3Title','why3Text','why4Title','why4Text'];
function getSettings(){const s={};(STATE.data.settings||[]).forEach(x=>s[x.Key]=x.Value);return s}
function renderSettings(){const s=getSettings();const textKeys=['heroText','aboutText','servicesText','plansText','galleryText','contactText','why1Text','why2Text','why3Text','why4Text'];$('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>Website Settings</h2><small>Edit text, buttons, links, social, map and slider timing.</small></div><button class="btn gold" onclick="saveSettings()">Save Changes</button></div><div class="grid2" style="margin-top:15px">${settingKeys.map(k=>`<div class="field"><label>${k}</label>${textKeys.includes(k)?`<textarea id="set_${k}" rows="3">${esc(s[k]||'')}</textarea>`:`<input id="set_${k}" value="${esc(s[k]||'')}">`}</div>`).join('')}</div><div id="settingsMsg" class="msg"></div></div><div class="panel"><h3>Logo Upload</h3><p class="hint">Upload logo → URL automatically goes into logoUrl. Image target is compressed toward 100 KB.</p><input id="logoFile" type="file" accept="image/*"><button class="btn dark" style="margin-top:10px" onclick="uploadSettingImage('logoFile','logoUrl')">Upload Logo</button><span id="logoMsg" class="hint" style="margin-left:10px"></span></div><div class="panel"><h3>Home Hero Slider</h3><p class="hint">Add images from Gallery with Section = Hero Slider. The first 10 active images are used automatically and change on desktop + mobile.</p><button class="btn dark" onclick="renderTab('gallery');setTimeout(()=>openEditor('gallery'),100)">+ Add Hero Image</button></div><div class="panel"><h3>Google Map</h3><p class="hint">Paste the Google Maps <b>Embed URL</b> in mapEmbedUrl. Paste the normal Maps URL in mapLink for the Open Map button.</p></div>`}
async function saveSettings(){const o={};settingKeys.forEach(k=>{const e=$('set_'+k);if(e)o[k]=e.value});$('settingsMsg').textContent='Saving…';try{const r=await adminApi('saveSettings',{settings:JSON.stringify(o)});STATE.data=r.data;renderSettings();$('settingsMsg').textContent='Saved ✓'}catch(e){$('settingsMsg').textContent=e.message}}
async function uploadSettingImage(fileId,key){const f=$(fileId).files[0];if(!f)return alert('File select karo.');$('logoMsg').textContent='Uploading…';try{const up=await uploadMedia(f,'');const s=getSettings();s[key]=up.url;const r=await adminApi('saveSettings',{settings:JSON.stringify({[key]:up.url})});STATE.data=r.data;renderSettings();$('logoMsg').textContent='Uploaded ✓'}catch(e){$('logoMsg').textContent=e.message}}
function renderCollection(type){const arr=STATE.data[type]||[];const label={services:'Services',plans:'Promotion Packages',gallery:'Gallery',testimonials:'Testimonials'}[type];$('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>${label}</h2><small>Add, edit, hide/show or delete items.</small></div><button class="btn gold" onclick="openEditor('${type}')">+ Add New</button></div><div class="list">${arr.map(x=>itemHtml(type,x)).join('')||'<p>No items yet.</p>'}</div></div>`}
function itemHtml(type,x){if(type==='gallery'){const media=String(x.MediaType||'image').toLowerCase();return `<div class="item">${media==='video'?`<video class="video-thumb" src="${esc(x.ImageURL)}" muted></video>`:`<img class="thumb" src="${esc(x.ImageURL||'')}" onerror="this.style.visibility='hidden'">`}<div class="main"><strong>${esc(x.Title)}</strong><small>${esc(x.Category)} • ${esc(x.Section||'Gallery')} • ${media} • ${x.Active?'Visible':'Hidden'}</small></div><div class="actions"><button class="btn light" onclick='openEditor("gallery",${JSON.stringify(x)})'>Edit / Replace</button><button class="btn danger" onclick='delItem("gallery","${esc(x.ID)}")'>Delete</button></div></div>`}return `<div class="item"><div class="main"><strong>${esc(x.Title||x.Name)}</strong><small>${esc(x.Short||x.Price||x.Role||'')} • ${x.Active?'Visible':'Hidden'}</small></div><div class="actions"><button class="btn light" onclick='openEditor("${type}",${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick='delItem("${type}","${esc(x.ID)}")'>Delete</button></div></div>`}
function openEditor(type,obj={}){const isNew=!obj.ID;const title={services:'Service',plans:'Package',gallery:'Media Item',testimonials:'Testimonial'}[type];$('modalTitle').textContent=(isNew?'Add ':'Edit ')+title;let h='';if(type==='services')h=`<div class="grid2"><div class="field"><label>Icon</label><input id="f_Icon" value="${esc(obj.Icon||'✦')}"></div><div class="field"><label>Title</label><input id="f_Title" value="${esc(obj.Title||'')}"></div><div class="field"><label>Short</label><input id="f_Short" value="${esc(obj.Short||'')}"></div><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div></div><div class="field"><label>Description</label><textarea id="f_Description" rows="4">${esc(obj.Description||'')}</textarea></div>`;if(type==='plans')h=`<div class="grid2"><div class="field"><label>Name</label><input id="f_Name" value="${esc(obj.Name||'')}"></div><div class="field"><label>Price</label><input id="f_Price" value="${esc(obj.Price||'')}"></div><div class="field"><label>Billing</label><input id="f_Billing" value="${esc(obj.Billing||'Monthly')}"></div><div class="field"><label>Badge</label><input id="f_Badge" value="${esc(obj.Badge||'')}"></div><div class="field"><label>CTA</label><input id="f_CTA" value="${esc(obj.CTA||'Get Started')}"></div><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div></div><div class="field"><label>Features — separate with |</label><textarea id="f_Features" rows="5">${esc(obj.Features||'')}</textarea></div>`;if(type==='gallery')h=`<div class="drop"><label><b>Image / Video</b></label><input id="f_file" type="file" accept="image/*,video/*"><div class="hint">Images are compressed toward 100 KB. Videos are uploaded as selected.</div></div><div class="grid2"><div class="field"><label>Media Type</label><select id="f_MediaType"><option value="image" ${String(obj.MediaType||'image')==='image'?'selected':''}>Image</option><option value="video" ${String(obj.MediaType||'').toLowerCase()==='video'?'selected':''}>Video</option></select></div><div class="field"><label>Section</label><select id="f_Section"><option value="Gallery" ${String(obj.Section||'Gallery')==='Gallery'?'selected':''}>Gallery</option><option value="Hero Slider" ${String(obj.Section||'')==='Hero Slider'?'selected':''}>Hero Slider</option></select></div></div><div class="field"><label>Title</label><input id="f_Title" value="${esc(obj.Title||'')}"></div><div class="grid2"><div class="field"><label>Category</label><input id="f_Category" value="${esc(obj.Category||'')}"></div><div class="field"><label>Click Link (optional)</label><input id="f_Link" value="${esc(obj.Link||'')}"></div></div><div class="field"><label>Current Media URL</label><input id="f_ImageURL" value="${esc(obj.ImageURL||'')}"></div><input id="f_DriveFileId" type="hidden" value="${esc(obj.DriveFileId||'')}"><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div>`;if(type==='testimonials')h=`<div class="grid2"><div class="field"><label>Name</label><input id="f_Name" value="${esc(obj.Name||'')}"></div><div class="field"><label>Role</label><input id="f_Role" value="${esc(obj.Role||'')}"></div><div class="field"><label>Rating 1-5</label><input id="f_Rating" type="number" min="1" max="5" value="${esc(obj.Rating||5)}"></div><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div></div><div class="field"><label>Quote</label><textarea id="f_Quote" rows="4">${esc(obj.Quote||'')}</textarea></div>`;$('modalBody').innerHTML=h+`<label class="check"><input id="f_Active" type="checkbox" ${obj.Active!==false?'checked':''}> Visible on website</label><button class="btn gold" style="margin-top:18px" onclick='saveItem("${type}",${JSON.stringify(obj)})'>Save</button><div id="editorMsg" class="msg"></div>`;$('modal').classList.add('show')}
async function saveItem(type,obj){const r={ID:obj.ID||''};const fields={services:['Icon','Title','Short','Description','Sort'],plans:['Name','Price','Billing','Badge','Features','CTA','Sort'],gallery:['Title','Category','MediaType','ImageURL','DriveFileId','Link','Section','Sort'],testimonials:['Name','Role','Quote','Rating','Sort']}[type];fields.forEach(k=>{const e=$('f_'+k);if(e)r[k]=e.value});r.Active=$('f_Active').checked;if(type==='gallery'){const file=$('f_file')?.files?.[0];if(file){$('editorMsg').textContent='Compressing/uploading…';try{const up=await uploadMedia(file,obj.DriveFileId||'');r.ImageURL=up.url;r.DriveFileId=up.fileId;r.MediaType=up.mediaType}catch(e){$('editorMsg').textContent=e.message;return}}}$('editorMsg').textContent='Saving…';try{const z=await adminApi('saveRow',{type,row:JSON.stringify(r)});STATE.data=z.data;closeModal();renderCollection(type)}catch(e){$('editorMsg').textContent=e.message}}
function closeModal(){$('modal').classList.remove('show')}
async function delItem(type,id){if(!confirm('Delete this item?'))return;try{const r=await adminApi('deleteRow',{type,id});STATE.data=r.data;renderCollection(type)}catch(e){alert(e.message)}}
function compressImage(file,max=100000){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,maxSide=1800;if(w>maxSide||h>maxSide){const s=Math.min(maxSide/w,maxSide/h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.82,data=c.toDataURL('image/jpeg',q);while(data.length>max*1.37&&q>.18){q-=.06;data=c.toDataURL('image/jpeg',q)}resolve({dataUrl:data,mimeType:'image/jpeg',name:file.name})};im.onerror=reject;im.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
function uploadMedia(file,oldId){const p=file.type.startsWith('image/')?compressImage(file):new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({dataUrl:r.result,mimeType:file.type,name:file.name});r.onerror=rej;r.readAsDataURL(file)});return p.then(x=>new Promise((resolve,reject)=>{const win=window.open('about:blank','vigyapanUpload','width=520,height=420');if(!win){reject(new Error('Popup blocked. Browser me popups allow karke dobara try karo.'));return}const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='vigyapanUpload';form.style.display='none';const all={action:'uploadMedia',key:KEY,dataUrl:x.dataUrl,mimeType:x.mimeType,name:x.name,oldFileId:oldId||''};Object.entries(all).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)});document.body.appendChild(form);const handler=e=>{if(e.data&&e.data.type==='VIGYAPAN_UPLOAD'){window.removeEventListener('message',handler);form.remove();try{win.close()}catch(_){};e.data.payload&&e.data.payload.ok?resolve(e.data.payload):reject(new Error(e.data.payload?.error||'Upload failed'))}};window.addEventListener('message',handler);form.submit();setTimeout(()=>{window.removeEventListener('message',handler);form.remove();try{win.close()}catch(_){};reject(new Error('Upload response timeout.'))},120000)}))}
function renderLeads(){const a=STATE.data.leads||[];$('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>Leads / Enquiries</h2><small>Website contact form submissions.</small></div></div><div class="list">${a.map(x=>`<div class="item"><div class="main"><strong>${esc(x.Name||'')}</strong><small>${esc(x.Phone||'')} • ${esc(x.Email||'')} • ${esc(x.Date||'')}</small><p style="margin:7px 0 0;font-size:12px">${esc(x.Message||'')}</p></div></div>`).join('')||'<p>No leads yet.</p>'}</div></div>`}
function renderSecurity(){$('content').innerHTML=`<div class="panel"><h2>Admin Key</h2><p style="font-size:12px;color:var(--muted)">Current key: ${esc(STATE.adminKeyMasked||'')}</p><div class="field"><label>New Admin Key</label><input id="newKey" type="password" minlength="8"></div><button class="btn gold" onclick="changeKey()">Change Key</button><div id="keyMsg" class="msg"></div></div>`}async function changeKey(){const n=$('newKey').value.trim();if(n.length<8){$('keyMsg').textContent='Minimum 8 characters.';return}try{await adminApi('changeKey',{newKey:n});KEY=n;sessionStorage.setItem('VIGYAPAN_ADMIN_KEY',KEY);$('keyMsg').textContent='Changed ✓'}catch(e){$('keyMsg').textContent=e.message}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>renderTab(b.dataset.tab));$('loginBtn').onclick=login;$('key').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{sessionStorage.removeItem('VIGYAPAN_ADMIN_KEY');location.reload()};if(KEY){adminApi('login').then(r=>showDash(r)).catch(()=>{sessionStorage.removeItem('VIGYAPAN_ADMIN_KEY');KEY='';})}
</script></body></html>
