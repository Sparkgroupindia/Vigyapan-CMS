<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vigyapan CMS Admin</title><style>
:root{--navy:#062944;--navy2:#031a2c;--gold:#e5b85f;--bg:#f4f6f8;--line:#dfe5ea;--muted:#657486}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:#152536}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:5;background:var(--navy2);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.08em}.brand small{display:block;color:#b9c7d1;font-size:9px;letter-spacing:.12em}.wrap{max-width:1180px;margin:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px #001b2b18;border:1px solid var(--line)}h1,h2,h3{margin-top:0}h1{font-family:Georgia,serif;font-size:38px}.ey{font-size:10px;font-weight:800;letter-spacing:.15em;color:#a57520}.field{margin:12px 0}.field label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.gold{background:var(--gold);color:#182536}.dark{background:var(--navy);color:#fff}.light{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:#a62222;border:1px solid #f0caca}.msg{font-size:11px;color:#b12b2b;min-height:18px}.dash{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-size:11px;font-weight:800}.tab.active{background:var(--navy);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8fafb;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:25px}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:15px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;justify-content:space-between}.item .main{flex:1}.item strong{display:block}.item small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:10px}.modal{position:fixed;inset:0;background:#031a2ccc;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:7px;font-size:11px}.thumb{width:75px;height:75px;object-fit:cover;border-radius:10px;background:#eee}.hidden{display:none!important}a{color:inherit}.links a{font-size:11px;color:#fff;margin-left:10px}.drop{border:1px dashed #c8d0d8;padding:14px;border-radius:12px;background:#fafbfc}.notice{padding:10px 12px;border-radius:10px;background:#fff7df;color:#7b5a1b;font-size:11px;margin-bottom:12px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}@media(max-width:500px){.cards{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:12px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="ey">VIGYAPAN • SECURE CMS</div><h1>Admin Dashboard</h1><p style="color:var(--muted);font-size:13px">Website content, services, packages, gallery and enquiries — all editable from here.</p><div class="field"><label>ADMIN KEY</label><input id="key" type="password" autocomplete="current-password" placeholder="Enter admin key"></div><button class="btn gold" style="width:100%" id="loginBtn">Open Dashboard →</button><div id="loginMsg" class="msg"></div></div></div>
<div id="dash" class="dash"><div class="top"><div class="brand">VIGYAPAN <small>WEBSITE CMS</small></div><div class="links"><a id="siteLink" target="_blank">Website</a><a id="sheetLink" target="_blank">Sheet</a><a id="folderLink" target="_blank">Drive</a><button id="logout" class="btn light" style="padding:7px 10px;font-size:10px">Logout</button></div></div><div class="wrap"><div class="nav"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="settings">Website Settings</button><button class="tab" data-tab="services">Services</button><button class="tab" data-tab="plans">Packages</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="testimonials">Testimonials</button><button class="tab" data-tab="leads">Leads</button><button class="tab" data-tab="security">Admin Key</button></div><div id="content"></div></div></div>
<div id="modal" class="modal"><div class="modalbox"><div class="toolbar"><h2 id="modalTitle">Edit</h2><button class="btn light" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<iframe name="postFrame" id="postFrame" class="hidden"></iframe>
<script src="config.js"></script><script>
let KEY=sessionStorage.getItem('VIGYAPAN_ADMIN_KEY')||'';let STATE=null;let currentTab='overview';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function api(action,fields={}){return new Promise((resolve,reject)=>{const cb='__v_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const q=new URLSearchParams({action,callback:cb,...fields});window[cb]=d=>{delete window[cb];s.remove();d&&d.ok?resolve(d):reject(new Error(d&&d.error||'Request failed'))};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('Apps Script API did not respond.'))};s.src=API_URL+'?'+q.toString();document.body.appendChild(s)})}
function adminApi(action,fields={}){return api(action,{key:KEY,...fields})}
async function login(){const k=$('key').value.trim();if(!k){$('loginMsg').textContent='Admin key enter karo.';return}KEY=k;sessionStorage.setItem('VIGYAPAN_ADMIN_KEY',KEY);$('loginBtn').disabled=true;$('loginMsg').textContent='Connecting…';try{const r=await adminApi('login');showDash(r.data);$('loginMsg').textContent=''}catch(e){sessionStorage.removeItem('VIGYAPAN_ADMIN_KEY');KEY='';$('loginMsg').textContent=e.message}finally{$('loginBtn').disabled=false}}
function showDash(data){STATE=data;$('login').style.display='none';$('dash').style.display='block';$('siteLink').href=location.origin+location.pathname.replace('/admin.html','')+'/';$('sheetLink').href=data.spreadsheetUrl;$('folderLink').href=data.folderUrl;renderTab(currentTab)}
function renderTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const d=STATE.data;if(tab==='overview')$('content').innerHTML=`<div class="cards"><div class="stat"><span>Services</span><b>${d.services.length}</b></div><div class="stat"><span>Packages</span><b>${d.plans.length}</b></div><div class="stat"><span>Gallery</span><b>${d.gallery.length}</b></div><div class="stat"><span>Testimonials</span><b>${d.testimonials.length}</b></div><div class="stat"><span>Leads</span><b>${(d.leads||[]).length}</b></div></div><div class="panel"><div class="notice">Public website: <b>${esc(location.origin+location.pathname.replace('/admin.html','')+'/')}</b><br>Admin is hosted directly on GitHub — no iframe is used.</div><h3>Quick start</h3><p style="font-size:12px;color:var(--muted)">Settings se logo, hero, contact aur social links change karo. Services/Packages/Gallery me Add New karke future me unlimited cards/items add kar sakte ho.</p></div>`;else if(tab==='settings')renderSettings();else if(['services','plans','gallery','testimonials'].includes(tab))renderCollection(tab);else if(tab==='leads')renderLeads();else renderSecurity()}
function renderSettings(){const s={};(STATE.data.settings||[]).forEach(x=>s[x.Key]=x.Value);const keys=['siteName','siteTagline','logoUrl','heroImage','heroEyebrow','heroTitle','heroText','heroButton','heroButtonLink','aboutTitle','aboutText','aboutButton','aboutButtonLink','servicesTitle','servicesText','galleryTitle','galleryText','plansTitle','plansText','contactTitle','contactText','phone','whatsapp','email','address','instagram','facebook','youtube','linkedin','footerText'];$('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>Website Settings</h2><small>Edit all main text and links.</small></div><button class="btn gold" onclick="saveSettings()">Save Changes</button></div><div class="grid2" style="margin-top:15px">${keys.map(k=>`<div class="field"><label>${k}</label>${['heroText','aboutText','servicesText','galleryText','plansText','contactText','footerText'].includes(k)?`<textarea id="set_${k}" rows="4">${esc(s[k]||'')}</textarea>`:`<input id="set_${k}" value="${esc(s[k]||'')}">`}</div>`).join('')}</div><div id="settingsMsg" class="msg"></div></div><div class="panel"><div class="toolbar"><div><b>Image upload</b><small style="display:block;color:var(--muted)">Upload image first, then paste the returned URL into logoUrl or heroImage.</small></div><button class="btn dark" onclick="openImageModal('settings')">Upload Image</button></div></div>`}
async function saveSettings(){const keys=['siteName','siteTagline','logoUrl','heroImage','heroEyebrow','heroTitle','heroText','heroButton','heroButtonLink','aboutTitle','aboutText','aboutButton','aboutButtonLink','servicesTitle','servicesText','galleryTitle','galleryText','plansTitle','plansText','contactTitle','contactText','phone','whatsapp','email','address','instagram','facebook','youtube','linkedin','footerText'];const o={};keys.forEach(k=>o[k]=$('set_'+k).value);$('settingsMsg').textContent='Saving…';try{const r=await adminApi('saveSettings',{settings:JSON.stringify(o)});STATE.data=r.data;renderSettings();$('settingsMsg').textContent='Saved ✓'}catch(e){$('settingsMsg').textContent=e.message}}
function renderCollection(type){const arr=STATE.data[type]||[];const label={services:'Services',plans:'Promotion Packages',gallery:'Gallery',testimonials:'Testimonials'}[type];$('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>${label}</h2><small>Add, edit, hide or delete items.</small></div><button class="btn gold" onclick="openEditor('${type}')">+ Add New</button></div><div class="list">${arr.map(x=>itemHtml(type,x)).join('')}</div></div>`}
function itemHtml(type,x){if(type==='gallery')return `<div class="item"><img class="thumb" src="${esc(x.ImageURL||'')}" onerror="this.style.visibility='hidden'"><div class="main"><strong>${esc(x.Title)}</strong><small>${esc(x.Category)} • ${x.Active?'Visible':'Hidden'}</small></div><div class="actions"><button class="btn light" onclick='openEditor("gallery",${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick='delItem("gallery","${esc(x.ID)}")'>Delete</button></div></div>`;return `<div class="item"><div class="main"><strong>${esc(x.Title||x.Name)}</strong><small>${esc(x.Short||x.Price||x.Role||'')} • ${x.Active?'Visible':'Hidden'}</small></div><div class="actions"><button class="btn light" onclick='openEditor("${type}",${JSON.stringify(x)})'>Edit</button><button class="btn danger" onclick='delItem("${type}","${esc(x.ID)}")'>Delete</button></div></div>`}
function openEditor(type,obj={}){const isNew=!obj.ID;const title={services:'Service',plans:'Package',gallery:'Gallery Item',testimonials:'Testimonial'}[type];$('modalTitle').textContent=(isNew?'Add ':'Edit ')+title;let h='';if(type==='services')h=`<div class="grid2"><div class="field"><label>Icon</label><input id="f_Icon" value="${esc(obj.Icon||'✦')}"></div><div class="field"><label>Title</label><input id="f_Title" value="${esc(obj.Title||'')}"></div><div class="field"><label>Short</label><input id="f_Short" value="${esc(obj.Short||'')}"></div><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div></div><div class="field"><label>Description</label><textarea id="f_Description" rows="4">${esc(obj.Description||'')}</textarea></div>`;if(type==='plans')h=`<div class="grid2"><div class="field"><label>Name</label><input id="f_Name" value="${esc(obj.Name||'')}"></div><div class="field"><label>Price</label><input id="f_Price" value="${esc(obj.Price||'')}"></div><div class="field"><label>Billing</label><input id="f_Billing" value="${esc(obj.Billing||'Monthly')}"></div><div class="field"><label>Badge</label><input id="f_Badge" value="${esc(obj.Badge||'')}"></div><div class="field"><label>CTA</label><input id="f_CTA" value="${esc(obj.CTA||'Get Started')}"></div><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div></div><div class="field"><label>Features — separate with |</label><textarea id="f_Features" rows="4">${esc(obj.Features||'')}</textarea></div>`;if(type==='gallery')h=`<div class="drop"><input id="f_file" type="file" accept="image/*"><small>Image automatically compressed toward 100 KB.</small></div><div class="field"><label>Title</label><input id="f_Title" value="${esc(obj.Title||'')}"></div><div class="grid2"><div class="field"><label>Category</label><input id="f_Category" value="${esc(obj.Category||'')}"></div><div class="field"><label>Link (optional)</label><input id="f_Link" value="${esc(obj.Link||'')}"></div></div><div class="field"><label>Current Image URL</label><input id="f_ImageURL" value="${esc(obj.ImageURL||'')}"></div><input id="f_DriveFileId" type="hidden" value="${esc(obj.DriveFileId||'')}"><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div>`;if(type==='testimonials')h=`<div class="grid2"><div class="field"><label>Name</label><input id="f_Name" value="${esc(obj.Name||'')}"></div><div class="field"><label>Role</label><input id="f_Role" value="${esc(obj.Role||'')}"></div><div class="field"><label>Rating 1-5</label><input id="f_Rating" type="number" min="1" max="5" value="${esc(obj.Rating||5)}"></div><div class="field"><label>Sort</label><input id="f_Sort" type="number" value="${esc(obj.Sort||1)}"></div></div><div class="field"><label>Quote</label><textarea id="f_Quote" rows="4">${esc(obj.Quote||'')}</textarea></div>`;$('modalBody').innerHTML=h+`<label class="check"><input id="f_Active" type="checkbox" ${obj.Active!==false?'checked':''}> Visible on website</label><button class="btn gold" style="margin-top:18px" onclick='saveItem("${type}",${JSON.stringify(obj)})'>Save</button><div id="editorMsg" class="msg"></div>`;$('modal').classList.add('show')}
async function saveItem(type,obj){const r={ID:obj.ID||''};const fields={services:['Icon','Title','Short','Description','Sort'],plans:['Name','Price','Billing','Badge','Features','CTA','Sort'],gallery:['Title','Category','ImageURL','DriveFileId','Link','Sort'],testimonials:['Name','Role','Quote','Rating','Sort']}[type];fields.forEach(k=>{const e=$('f_'+k);if(e)r[k]=e.value});r.Active=$('f_Active').checked;if(type==='gallery'){const file=$('f_file')?.files?.[0];if(file){$('editorMsg').textContent='Compressing/uploading image…';try{const up=await upload(file,obj.DriveFileId||'');r.ImageURL=up.url;r.DriveFileId=up.fileId}catch(e){$('editorMsg').textContent=e.message;return}}}$('editorMsg').textContent='Saving…';try{const z=await adminApi('saveRow',{type,row:JSON.stringify(r)});STATE.data=z.data;closeModal();renderCollection(type)}catch(e){$('editorMsg').textContent=e.message}}
function closeModal(){$('modal').classList.remove('show')}
async function delItem(type,id){if(!confirm('Delete this item?'))return;try{const r=await adminApi('deleteRow',{type,id});STATE.data=r.data;renderCollection(type)}catch(e){alert(e.message)}}
function compress(file,max=100000){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,maxSide=1800;if(w>maxSide||h>maxSide){const s=Math.min(maxSide/w,maxSide/h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);let q=.82,data=c.toDataURL('image/jpeg',q);while(data.length>max*1.37&&q>.25){q-=.07;data=c.toDataURL('image/jpeg',q)}resolve({dataUrl:data,mimeType:'image/jpeg',name:file.name})};im.onerror=reject;im.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
function upload(file,oldId){return compress(file).then(x=>new Promise((resolve,reject)=>{const win=window.open('about:blank','vigyapanUpload','width=520,height=420');if(!win){reject(new Error('Browser ne upload window block kar diya. Popup allow karke dobara try karo.'));return}const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='vigyapanUpload';form.style.display='none';const all={action:'uploadImage',key:KEY,dataUrl:x.dataUrl,mimeType:x.mimeType,name:x.name,oldFileId:oldId||''};Object.entries(all).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)});document.body.appendChild(form);const handler=e=>{if(e.data&&e.data.type==='VIGYAPAN_UPLOAD'){window.removeEventListener('message',handler);form.remove();try{win.close()}catch(_){};e.data.payload&&e.data.payload.ok?resolve(e.data.payload):reject(new Error(e.data.payload&&e.data.payload.error||'Upload failed'))}};window.addEventListener('message',handler);form.submit();setTimeout(()=>{window.removeEventListener('message',handler);form.remove();try{win.close()}catch(_){};reject(new Error('Upload response timeout.'))},60000)}))}
function openImageModal(){openEditor('gallery',{})}
function renderLeads(){const a=STATE.data.leads||[];$('content').innerHTML=`<div class="panel"><div class="toolbar"><div><h2>Leads / Enquiries</h2><small>Website contact form submissions.</small></div></div><div class="list">${a.map(x=>`<div class="item"><div class="main"><strong>${esc(x.Name||'')}</strong><small>${esc(x.Phone||'')} • ${esc(x.Email||'')} • ${esc(x.Date||'')}</small><p style="margin:7px 0 0;font-size:12px">${esc(x.Message||'')}</p></div></div>`).join('')||'<p>No leads yet.</p>'}</div></div>`}
function renderSecurity(){$('content').innerHTML=`<div class="panel"><h2>Admin Key</h2><p style="font-size:12px;color:var(--muted)">Current key: ${esc(STATE.adminKeyMasked||'')}</p><div class="field"><label>New Admin Key</label><input id="newKey" type="password" minlength="8"></div><button class="btn gold" onclick="changeKey()">Change Key</button><div id="keyMsg" class="msg"></div></div>`}async function changeKey(){const n=$('newKey').value.trim();if(n.length<8){$('keyMsg').textContent='Minimum 8 characters.';return}try{await adminApi('changeKey',{newKey:n});KEY=n;sessionStorage.setItem('VIGYAPAN_ADMIN_KEY',KEY);$('keyMsg').textContent='Changed ✓'}catch(e){$('keyMsg').textContent=e.message}}
window.addEventListener('message',()=>{});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>renderTab(b.dataset.tab));$('loginBtn').onclick=login;$('key').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{sessionStorage.removeItem('VIGYAPAN_ADMIN_KEY');location.reload()};
if(KEY){adminApi('login').then(r=>showDash(r.data)).catch(()=>{sessionStorage.removeItem('VIGYAPAN_ADMIN_KEY');KEY='';})}
</script></body></html>
